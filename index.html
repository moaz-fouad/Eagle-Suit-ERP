<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle Suit — نظام إدارة محل البدل الرجالية</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<div class="login-wrap" id="login">
  <div class="login-card" id="loginCard">
    <img src="assets/logo_lockup.png" class="login-logo" alt="Eagle Suit">
    <div class="login-sub" id="lgSub">FOR MEN'S SUITS</div>

    <div class="who" id="whoPick"></div>

    <div class="f"><label id="lbUser">اسم المستخدم</label>
      <div class="ctl"><input id="lgUser" autocomplete="off"></div></div>
    <div class="f"><label id="lbPass">كلمة المرور</label>
      <div class="ctl"><input id="lgPass" type="password" autocomplete="off"></div></div>

    <div class="login-err" id="lgErr"></div>
    <button class="btn block" id="lgGo"><span id="lgGoTxt">دخول</span></button>
    <div class="hint-chip" id="lgHint"></div>
    <div class="login-sig">Developed By <b>Moaz Fouad</b></div>
  </div>
</div>

<!-- ========================= APP ========================= -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <img src="assets/logo_mark.png" alt="">
      <div>
        <div class="bname gold-text">EAGLE SUIT</div>
        <div class="btag" id="brandTag">FOR MEN'S SUITS</div>
      </div>
      <div class="sig" title="Developed By Moaz Fouad">
        <span class="sig-by">Developed By</span>
        <span class="sig-name">Moaz Fouad</span>
      </div>
    </div>
    <div class="top-right">
      <div class="sync-dot" id="syncDot" title=""></div>
      <div class="clock" id="clock"></div>
      <div class="who-badge" id="whoBadge"></div>
      <div class="icon-btn lang" id="langBtn">EN</div>
      <div class="icon-btn" id="outBtn" title="خروج"></div>
    </div>
  </div>

  <div class="nav" id="nav"></div>

  <div class="wrap">
    <div class="page-head">
      <h1 id="pageTitle"></h1>
      <span class="crumb" id="pageCrumb"></span>
    </div>
    <div class="subtabs" id="subtabs"></div>
    <div id="content"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div id="toast" class="toast"></div>
<div id="modalWrap" class="modal-wrap"><div class="modal" id="modal"></div></div>
<div id="printArea"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/filestore.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pages/invoice.js"></script>
<script src="assets/js/pages/inventory.js"></script>
<script src="assets/js/pages/customers.js"></script>
<script src="assets/js/pages/sales_history.js"></script>
<script src="assets/js/pages/expenses.js"></script>
<script src="assets/js/pages/reports.js"></script>
<script src="assets/js/pages/settings.js"></script>
<script src="assets/js/print.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
